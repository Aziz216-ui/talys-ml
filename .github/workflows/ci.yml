name: CI

# Integration continue : chaque push et pull request est verifie par les tests unitaires.
# Le reentrainement du modele n'est pas fait ici : il est orchestre par Prefect
# (flows/retrain_flow.py), au plus pres des donnees du Data Mart MySQL.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            src/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Run unit tests
        run: pytest -v
