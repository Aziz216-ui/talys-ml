name: Retrain Model

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
  push:
    paths:
      - 'data/raw/fact_sales.csv'
      - 'data/raw/dim_date.csv'
      - 'data/raw/dim_product.csv'

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/

      - name: Run training pipeline
        run: |
          python src/main.py

      - name: Commit updated model, predictions, MLflow tracking and LLM report
        run: |
          git config --global user.email "ci@talys-ml.local"
          git config --global user.name "GitHub Actions CI"
          git add models/ data/raw/predictions_ventes.csv data/raw/ventes_combinees.csv data/reports/ mlflow.db mlruns/
          git diff --staged --quiet || git commit -m "Auto-retrain: update model, predictions, MLflow tracking and LLM report [skip ci]"
          git push



